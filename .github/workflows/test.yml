name: Infinity Protocol CI (Apex Pipeline)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  apex_verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (Apex v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Security & Secret Scanning (Sovereign Security v6.2)
        continue-on-error: true
        run: |
          # Native CI execution of audit policies
          npm audit --audit-level=high
          if [ -f "scripts/infinity-guardian.js" ]; then npm run test:security; fi

      - name: Data Integrity & Schema Validation
        run: |
          if grep -q '"test:integrity":' package.json; then npm run test:integrity; fi

      - name: Production Build Verification
        run: |
          if grep -q '"build":' package.json; then npm run build; fi

      - name: Functions Verification
        if: hashFiles('functions/package.json') != ''
        working-directory: ./functions
        run: |
          npm ci
          if grep -q '"test":' package.json; then npm run test; fi
          if grep -q '"test:security":' package.json; then npm run test:security; fi

      - name: Global Health Check
        run: |
          echo "Infinity Protocol v5.0: Sovereign Apex Verification Complete."
